name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache wixl binary
        id: cache-wixl
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/wixl
          key: wixl-0.101-ubuntu-22.04

      - name: Install build dependencies
        run: |
          sudo apt-get install -y gcc-mingw-w64-x86-64
          if [ "${{ steps.cache-wixl.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get install -y \
              libglib2.0-dev libgsf-1-dev libgcab-dev \
              libgirepository1.0-dev libxml2-dev \
              valac meson ninja-build pkg-config
            # Ubuntu 22.04's msitools repack omits wixl; build from upstream source
            curl -fsSL https://download.gnome.org/sources/msitools/0.101/msitools-0.101.tar.xz \
              | tar -xJ -C /tmp
            cd /tmp/msitools-0.101
            meson setup _build --buildtype=release
            ninja -C _build
            mkdir -p /home/runner/.cache/wixl
            cp "$(find _build -name wixl -type f | head -1)" /home/runner/.cache/wixl/wixl
          fi
          sudo install -m 755 /home/runner/.cache/wixl/wixl /usr/local/bin/wixl
          file /usr/local/bin/wixl
          ldd /usr/local/bin/wixl || true
          wixl --version

      - name: Download modules
        run: go mod download

      - name: Build Windows binary
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc \
            go build -ldflags="-H windowsgui" -o warden.exe .

      - name: Generate version tag
        id: version
        run: |
          base=$(cat VERSION)
          echo "tag=v${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "msi_version=${base}.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build MSI installer
        run: wixl -D Version=${{ steps.version.outputs.msi_version }} -a x64 -o warden.msi installer/warden.wxs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            warden.exe
            warden.msi
