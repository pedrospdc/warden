name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install build dependencies
        run: |
          sudo apt-get install -y gcc-mingw-w64-x86-64 libgcab-1.0-0 libgsf-1-114
          # Ubuntu 22.04's msitools repack omits wixl; extract it from the focal package
          curl -fsSL http://archive.ubuntu.com/ubuntu/pool/universe/m/msitools/msitools_0.100-1_amd64.deb \
            -o /tmp/msitools-focal.deb
          dpkg-deb -x /tmp/msitools-focal.deb /tmp/msitools-focal
          sudo install -m 755 /tmp/msitools-focal/usr/bin/wixl /usr/local/bin/wixl

      - name: Download modules
        run: go mod download

      - name: Build Windows binary
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc \
            go build -ldflags="-H windowsgui" -o warden.exe .

      - name: Generate version tag
        id: version
        run: |
          base=$(cat VERSION)
          echo "tag=v${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "msi_version=${base}.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build MSI installer
        run: wixl -D Version=${{ steps.version.outputs.msi_version }} -a x64 -o warden.msi installer/warden.wxs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            warden.exe
            warden.msi
